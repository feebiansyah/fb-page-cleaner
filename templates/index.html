<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FB Page Cleaner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>.log { font-family: ui-monospace, monospace; font-size: 0.85rem; }</style>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-5xl mx-auto p-6">
  <h1 class="text-2xl font-bold mb-2">Facebook Page Post Cleaner</h1>
  <p class="text-sm text-gray-600 mb-6">Versi lokal aman. Token hanya hidup di memory server ini.</p>

  <div id="login-box" class="bg-white rounded-lg shadow p-6 mb-6">
    <label class="block text-sm font-medium mb-2">User / System User Access Token</label>
    <textarea id="token" rows="3" class="w-full border rounded p-2 font-mono text-sm" placeholder="Paste token di sini..."></textarea>
    <button onclick="login()" class="mt-3 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Load Pages</button>
    <div id="login-status" class="mt-2 text-sm"></div>
  </div>

  <div id="main" class="hidden">
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-semibold">Pilih Page</h2>
        <button onclick="logout()" class="text-sm text-red-600">Logout</button>
      </div>
      <div id="pages" class="space-y-2"></div>
      <div class="mt-4 flex gap-3 items-center">
        <button id="load-btn" onclick="loadPosts()" class="bg-green-600 text-white px-5 py-2 rounded hover:bg-green-700">Load Posts</button>
        <span class="text-xs text-gray-500">Mengambil semua postingan (termasuk video &amp; reels), kecuali story.</span>
      </div>
    </div>

    <div id="posts-area" class="bg-white rounded-lg shadow p-6 mb-6 hidden">
      <div class="flex justify-between mb-3 flex-wrap gap-2">
        <h2 class="font-semibold">Postingan <span id="total-count" class="text-sm text-gray-500"></span></h2>
        <div>
          <label class="text-sm mr-3"><input type="checkbox" id="dry-run" checked /> Dry Run</label>
          <label class="text-sm mr-2">Delay: <input type="number" id="delay" value="300" min="0" max="60000" class="w-16 border rounded px-1" /> ms</label>
          <label class="text-sm">Paralel: <input type="number" id="concurrency" value="3" min="1" max="5" class="w-12 border rounded px-1" /></label>
        </div>
      </div>
      <div id="load-status" class="mb-3 text-xs whitespace-pre-line text-gray-700 max-h-40 overflow-y-auto"></div>
      <div id="posts" class="max-h-96 overflow-y-auto border rounded p-2 text-sm"></div>
      <div class="mt-4 flex gap-2 items-center">
        <button onclick="selectAll()" class="text-sm border px-3 py-1 rounded">Pilih Semua</button>
        <button onclick="deselectAll()" class="text-sm border px-3 py-1 rounded">Hapus Pilihan</button>
        <button onclick="deleteSelected()" class="bg-red-600 text-white px-4 py-2 rounded">Hapus yang Dipilih</button>
        <span id="sel-count" class="text-sm text-gray-600"></span>
      </div>
    </div>

    <div id="log-area" class="bg-gray-900 text-green-400 rounded-lg p-4 log hidden">
      <div class="mb-3">
        <div id="progress-text" class="text-sm mb-2">Menunggu proses...</div>
        <div class="w-full bg-gray-700 rounded-full h-3 overflow-hidden">
          <div id="progress-bar" class="bg-green-500 h-3 rounded-full" style="width:0%"></div>
        </div>
      </div>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
let sessionId = null;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function login() {
  const token = document.getElementById("token").value.trim();
  const status = document.getElementById("login-status");
  status.textContent = "Loading...";
  try {
    const fd = new FormData();
    fd.append("token", token);
    const res = await fetch("/api/login", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Error");
    sessionId = data.session_id;
    renderPages(data.pages);
    document.getElementById("login-box").classList.add("hidden");
    document.getElementById("main").classList.remove("hidden");
    status.textContent = "";
  } catch (e) {
    status.textContent = "Error: " + e.message;
  }
}

function renderPages(pages) {
  document.getElementById("pages").innerHTML = pages.map(p => `
    <label class="flex items-center gap-2 p-2 border rounded hover:bg-gray-50">
      <input type="checkbox" class="page-check" value="${esc(p.id)}">
      <span class="font-medium">${esc(p.name)}</span>
      <span class="text-xs text-gray-500">${esc(p.id)}</span>
    </label>`).join("");
}

async function loadPosts() {
  const pageIds = Array.from(document.querySelectorAll(".page-check:checked")).map(cb => cb.value);
  if (!pageIds.length) return alert("Pilih minimal 1 Page");

  const btn = document.getElementById("load-btn");
  const postsEl = document.getElementById("posts");
  const statusEl = document.getElementById("load-status");
  document.getElementById("posts-area").classList.remove("hidden");
  postsEl.textContent = "Memuat semua postingan, mohon tunggu...";
  statusEl.textContent = "";
  document.getElementById("total-count").textContent = "";
  btn.disabled = true;
  btn.classList.add("opacity-50");

  try {
    const res = await fetch("/api/load/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, page_ids: pageIds })
    });
    const started = await res.json();
    if (!res.ok) throw new Error(started.detail || "Error");

    let data;
    while (true) {
      await sleep(1000);
      const poll = await fetch(`/api/load/progress/${started.job_id}`);
      data = await poll.json();
      if (!poll.ok) throw new Error(data.detail || "Error");
      postsEl.textContent = `Memuat... Page ${data.pages_done}/${data.total_pages} (${data.current || "-"}) | ${data.count} item`;
      statusEl.textContent = data.log.join("\n");
      statusEl.scrollTop = statusEl.scrollHeight;
      if (data.status !== "running") break;
    }
    if (data.status === "error") throw new Error(data.error || "Gagal memuat");
    statusEl.textContent = data.log.join("\n") + (data.warnings.length ? "\n\nPERINGATAN:\n" + data.warnings.join("\n") : "");
    renderPosts(data.posts);
  } catch (e) {
    postsEl.textContent = "Error: " + e.message;
  } finally {
    btn.disabled = false;
    btn.classList.remove("opacity-50");
  }
}

function renderPosts(posts) {
  const postsEl = document.getElementById("posts");
  document.getElementById("total-count").textContent = `(${posts.length} item)`;
  if (!posts.length) { postsEl.textContent = "Tidak ada data"; return; }

  const badge = { reel: "REEL", video: "VIDEO" };
  postsEl.innerHTML = posts.map(p => {
    const text = (p.message || "").trim() || "(tidak ada caption)";
    const short = text.length > 120 ? text.slice(0, 120) + "…" : text;
    const thumb = p.full_picture;
    const b = badge[p.type] ? ` <span class="ml-1 px-1 py-0.5 bg-purple-600 text-white text-[10px] rounded">${badge[p.type]}</span>` : "";
    return `
      <label class="flex gap-3 py-2 border-b text-xs items-start">
        <input type="checkbox" class="post-check mt-1" value="${esc(p.id)}" data-page="${esc(p._pageId)}" onchange="updateSel()">
        ${thumb ? `<img src="${esc(thumb)}" class="w-16 h-16 object-cover rounded" loading="lazy" onerror="this.style.display='none'">` : '<div class="w-16 h-16 bg-gray-200 rounded flex items-center justify-center text-gray-400 text-[10px]">no img</div>'}
        <div class="flex-1">
          <div class="font-medium">${esc(short)}${b}</div>
          <div class="text-gray-500 mt-1">${esc((p.created_time || "").slice(0, 16).replace("T", " "))} · ${esc(p._pageName)} ${p.permalink_url ? `· <a href="${esc(p.permalink_url)}" target="_blank" class="text-blue-600">buka</a>` : ""} <span class="text-gray-400">(${esc(p.id)})</span></div>
        </div>
      </label>`;
  }).join("");
  updateSel();
}

function updateSel() {
  const n = document.querySelectorAll(".post-check:checked").length;
  document.getElementById("sel-count").textContent = n ? `${n} dipilih` : "";
}
function selectAll() { document.querySelectorAll(".post-check").forEach(cb => cb.checked = true); updateSel(); }
function deselectAll() { document.querySelectorAll(".post-check").forEach(cb => cb.checked = false); updateSel(); }

async function deleteSelected() {
  const checked = Array.from(document.querySelectorAll(".post-check:checked"));
  if (!checked.length) return alert("Pilih dulu");
  const ids = checked.map(cb => cb.value);
  const post_pages = {};
  checked.forEach(cb => post_pages[cb.value] = cb.dataset.page);

  const dry = document.getElementById("dry-run").checked;
  const delay = parseInt(document.getElementById("delay").value) || 300;
  const concurrency = parseInt(document.getElementById("concurrency").value) || 3;
  if (!dry && !confirm(`Hapus ${ids.length} item? Ini tidak bisa dibatalkan.`)) return;

  const logArea = document.getElementById("log-area");
  const log = document.getElementById("log");
  const progressText = document.getElementById("progress-text");
  const progressBar = document.getElementById("progress-bar");
  logArea.classList.remove("hidden");
  log.textContent = "Memulai...\n";
  progressText.textContent = `0 / ${ids.length}`;
  progressBar.style.width = "0%";

  try {
    const res = await fetch("/api/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, post_ids: ids, post_pages, page_tokens: {}, dry_run: dry, delay_ms: delay, concurrency })
    });
    const started = await res.json();
    if (!res.ok) throw new Error(started.detail);

    let data;
    while (true) {
      await sleep(600);
      const poll = await fetch(`/api/delete/progress/${started.job_id}`);
      data = await poll.json();
      const pct = data.total ? Math.round((data.completed / data.total) * 100) : 0;
      progressText.textContent = `${data.completed} / ${data.total} (${pct}%) | Berhasil ${data.success} | Gagal ${data.failed}`;
      progressBar.style.width = pct + "%";
      if (data.status !== "running") break;
    }
    log.textContent += `Selesai: ${data.success}/${data.total}\n`;
    (data.results || []).forEach(r => {
      log.textContent += `${r.success ? "✓" : "✗"} ${r.post_id} ${r.error || ""}\n`;
      if (r.success && !r.dry_run) {
        const cb = document.querySelector(`.post-check[value="${CSS.escape(r.post_id)}"]`);
        if (cb) cb.closest("label").remove();
      }
    });
    updateSel();
  } catch (e) {
    log.textContent += "Error: " + e.message;
  }
}

async function logout() {
  if (sessionId) {
    const fd = new FormData();
    fd.append("session_id", sessionId);
    await fetch("/api/logout", { method: "POST", body: fd });
  }
  location.reload();
}
</script>
</body>
</html>
