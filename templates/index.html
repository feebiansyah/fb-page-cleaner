<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FB Page Cleaner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>.log { font-family: ui-monospace, monospace; font-size: 0.85rem; }</style>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-5xl mx-auto p-6">
  <h1 class="text-2xl font-bold mb-2">Facebook Page Post Cleaner</h1>
  <p class="text-sm text-gray-600 mb-6">Versi lokal aman. Token hanya hidup di memory server ini.</p>

  <div id="login-box" class="bg-white rounded-lg shadow p-6 mb-6">
    <label class="block text-sm font-medium mb-2">User / System User Access Token</label>
    <textarea id="token" rows="3" class="w-full border rounded p-2 font-mono text-sm" placeholder="Paste token di sini..."></textarea>
    <button onclick="login()" class="mt-3 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Load Pages</button>
    <div id="login-status" class="mt-2 text-sm"></div>
  </div>

  <div id="main" class="hidden">
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-semibold">Pilih Page</h2>
        <button onclick="logout()" class="text-sm text-red-600">Logout</button>
      </div>
      <div id="pages" class="space-y-2"></div>
      <div class="mt-4 flex gap-2 flex-wrap items-center">
        <input type="number" id="post-limit" value="50" min="1" max="10000" class="border rounded px-2 py-1 w-20" />
        <span class="text-sm self-center">maks per page</span>
        <input type="date" id="since" class="border rounded px-2 py-1" />
        <span class="text-sm self-center">sejak</span>
        <button onclick="loadSelectedPages('posts')" class="bg-green-600 text-white px-4 py-1 rounded">Load Posts</button>
        <button onclick="loadSelectedPages('videos')" class="bg-purple-600 text-white px-4 py-1 rounded">Load Videos</button>
        <button onclick="checkAdsPosts()" class="bg-orange-500 text-white px-4 py-1 rounded text-sm">Cek Postingan Ads</button>
        <span id="ads-status" class="text-xs text-gray-600"></span>
      </div>
    </div>

    <div id="posts-area" class="bg-white rounded-lg shadow p-6 mb-6 hidden">
      <div class="flex justify-between mb-3">
        <h2 class="font-semibold">Postingan / Video</h2>
        <div>
          <label class="text-sm mr-3"><input type="checkbox" id="dry-run" checked /> Dry Run</label>
          <label class="text-sm mr-2">Delay: <input type="number" id="delay" value="300" min="0" max="60000" class="w-16 border rounded px-1" /> ms</label>
          <label class="text-sm">Paralel: <input type="number" id="concurrency" value="3" min="1" max="5" class="w-12 border rounded px-1" /></label>
        </div>
      </div>
      <div id="load-status" class="mb-3 text-sm whitespace-pre-line"></div>
      <div id="posts" class="max-h-96 overflow-y-auto border rounded p-2 text-sm"></div>
      <div class="mt-4 flex gap-2">
        <button onclick="selectAll()" class="text-sm border px-3 py-1 rounded">Pilih Semua</button>
        <button onclick="deselectAll()" class="text-sm border px-3 py-1 rounded">Hapus Pilihan</button>
        <button onclick="deleteSelected()" class="bg-red-600 text-white px-4 py-2 rounded">Hapus yang Dipilih</button>
      </div>
    </div>

    <div id="log-area" class="bg-gray-900 text-green-400 rounded-lg p-4 log hidden">
      <div class="mb-3">
        <div id="progress-text" class="text-sm mb-2">Menunggu proses...</div>
        <div class="w-full bg-gray-700 rounded-full h-3 overflow-hidden">
          <div id="progress-bar" class="bg-green-500 h-3 rounded-full" style="width:0%"></div>
        </div>
      </div>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
let sessionId = null;
let protectedPostIds = new Set();

function isProtected(postId) {
  if (!postId || protectedPostIds.size === 0) return false;
  const id = String(postId);
  if (protectedPostIds.has(id)) return true;
  const parts = id.split("_");
  if (parts.length >= 2 && protectedPostIds.has(parts[parts.length - 1])) return true;
  return false;
}

async function checkAdsPosts() {
  if (!sessionId) return alert("Login dulu");
  const status = document.getElementById("ads-status");
  status.textContent = "Mengecek iklan...";
  try {
    const res = await fetch(`/api/ads-posts/${sessionId}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Error");
    protectedPostIds = new Set(data.protected_posts || []);
    status.textContent = `Ditemukan ${data.count} postingan dipakai ads`;
    if (document.getElementById("posts").children.length) markProtectedPosts();
  } catch (e) {
    status.textContent = "Error: " + e.message;
  }
}

function markProtectedPosts() {
  document.querySelectorAll(".post-check").forEach(cb => {
    if (isProtected(cb.value)) {
      cb.disabled = true;
      cb.checked = false;
      const row = cb.closest("label");
      row.classList.add("bg-yellow-50", "border-l-4", "border-orange-400");
      if (!row.querySelector(".ads-badge")) {
        const badge = document.createElement("span");
        badge.className = "ads-badge ml-1 px-1.5 py-0.5 bg-orange-500 text-white text-[10px] rounded";
        badge.textContent = "ADS";
        row.querySelector(".font-medium").appendChild(badge);
      }
    }
  });
}

async function login() {
  const token = document.getElementById("token").value.trim();
  const status = document.getElementById("login-status");
  status.textContent = "Loading...";
  try {
    const fd = new FormData();
    fd.append("token", token);
    const res = await fetch("/api/login", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Error");
    sessionId = data.session_id;
    renderPages(data.pages);
    document.getElementById("login-box").classList.add("hidden");
    document.getElementById("main").classList.remove("hidden");
    status.textContent = "";
  } catch (e) {
    status.textContent = "Error: " + e.message;
  }
}

function renderPages(pages) {
  document.getElementById("pages").innerHTML = pages.map(p => `
    <label class="flex items-center gap-2 p-2 border rounded hover:bg-gray-50">
      <input type="checkbox" class="page-check" value="${p.id}" data-name="${p.name}">
      <span class="font-medium">${p.name}</span>
      <span class="text-xs text-gray-500">${p.id}</span>
    </label>
  `).join("");
}

async function loadSelectedPages(type = "posts") {
  const checks = Array.from(document.querySelectorAll(".page-check:checked"));
  if (!checks.length) return alert("Pilih minimal 1 Page");
  const limit = parseInt(document.getElementById("post-limit").value) || 50;
  const since = document.getElementById("since").value;
  const postsEl = document.getElementById("posts");
  const statusEl = document.getElementById("load-status");
  document.getElementById("posts-area").classList.remove("hidden");
  postsEl.textContent = "Memuat...";
  statusEl.textContent = "";

  const allPosts = [];
  const seen = new Set();
  const endpoint = type === "videos" ? "videos" : "posts";

  for (const cb of checks) {
    const pageId = cb.value;
    const pageName = cb.dataset.name;
    const query = new URLSearchParams({ limit: String(limit) });
    if (since && type === "posts") query.set("since", since);
    try {
      const res = await fetch(`/api/${endpoint}/${sessionId}/${pageId}?${query}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Error");
      (data.posts || []).forEach(p => {
        if (p.id && !seen.has(p.id)) {
          seen.add(p.id);
          p._pageName = pageName;
          p._pageId = pageId;
          allPosts.push(p);
        }
      });
      statusEl.textContent += `${pageName}: ${data.count || 0} ${type}\n`;
    } catch (e) {
      statusEl.textContent += `${pageName}: Gagal - ${e.message}\n`;
    }
  }

  if (!allPosts.length) {
    postsEl.textContent = "Tidak ada data";
    return;
  }

  postsEl.innerHTML = allPosts.map(p => {
    const thumb = p.full_picture || "";
    const text = (p.message || "").trim() || "(tidak ada caption)";
    const short = text.length > 120 ? text.slice(0, 120) + "…" : text;
    const prot = isProtected(p.id);
    return `
      <label class="flex gap-3 py-2 border-b text-xs items-start ${prot ? "bg-yellow-50 border-l-4 border-orange-400" : ""}">
        <input type="checkbox" class="post-check mt-1" value="${p.id}" data-page="${p._pageId}" ${prot ? "disabled" : ""}>
        ${thumb ? `<img src="${thumb}" class="w-16 h-16 object-cover rounded" loading="lazy" onerror="this.style.display='none'">` : '<div class="w-16 h-16 bg-gray-200 rounded flex items-center justify-center text-gray-400 text-[10px]">no img</div>'}
        <div class="flex-1">
          <div class="font-medium">${short}${prot ? ' <span class="ads-badge ml-1 px-1 py-0.5 bg-orange-500 text-white text-[10px] rounded">ADS</span>' : ""}</div>
          <div class="text-gray-500 mt-1">${p.created_time?.slice(0,16).replace("T"," ") || ""} · ${p._pageName} · <a href="${p.permalink_url || "#"}" target="_blank" class="text-blue-600">buka</a> <span class="text-gray-400">(${p.id})</span></div>
        </div>
      </label>`;
  }).join("");
  markProtectedPosts();
}

function selectAll() {
  document.querySelectorAll(".post-check:not(:disabled)").forEach(cb => cb.checked = true);
}
function deselectAll() {
  document.querySelectorAll(".post-check").forEach(cb => cb.checked = false);
}

async function deleteSelected() {
  const ids = Array.from(document.querySelectorAll(".post-check:checked")).filter(cb => !cb.disabled).map(cb => cb.value);
  if (!ids.length) return alert("Pilih dulu");
  const dry = document.getElementById("dry-run").checked;
  const delay = parseInt(document.getElementById("delay").value) || 300;
  const concurrency = parseInt(document.getElementById("concurrency").value) || 3;
  if (!dry && !confirm(`Hapus ${ids.length} item?`)) return;

  const logArea = document.getElementById("log-area");
  const log = document.getElementById("log");
  const progressText = document.getElementById("progress-text");
  const progressBar = document.getElementById("progress-bar");
  logArea.classList.remove("hidden");
  log.textContent = "Memulai...\n";
  progressText.textContent = `0 / ${ids.length}`;
  progressBar.style.width = "0%";

  try {
    const res = await fetch("/api/delete", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ session_id: sessionId, post_ids: ids, page_tokens: {}, dry_run: dry, delay_ms: delay, concurrency })
    });
    const started = await res.json();
    if (!res.ok) throw new Error(started.detail);

    let data;
    while (true) {
      await new Promise(r => setTimeout(r, 600));
      const poll = await fetch(`/api/delete/progress/${started.job_id}`);
      data = await poll.json();
      const pct = data.total ? Math.round((data.completed / data.total) * 100) : 0;
      progressText.textContent = `${data.completed} / ${data.total} (${pct}%) | Berhasil ${data.success} | Gagal ${data.failed}`;
      progressBar.style.width = pct + "%";
      if (data.status !== "running") break;
    }
    log.textContent += `Selesai: ${data.success}/${data.total}\n`;
    (data.results || []).forEach(r => {
      log.textContent += `${r.success ? "✓" : "✗"} ${r.post_id} ${r.error || ""}\n`;
      if (r.success && !r.dry_run) {
        const cb = document.querySelector(`.post-check[value="${r.post_id}"]`);
        if (cb) cb.closest("label").remove();
      }
    });
  } catch (e) {
    log.textContent += "Error: " + e.message;
  }
}

async function logout() {
  if (sessionId) {
    const fd = new FormData();
    fd.append("session_id", sessionId);
    await fetch("/api/logout", { method: "POST", body: fd });
  }
  location.reload();
}
</script>
</body>
</html>
